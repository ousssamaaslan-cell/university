<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- For the maintainer only: netlify.toml sends the same instruction as a header for /admin/. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- The page is reached as /admin or /admin/; the files beside it are found either way. -->
    <base href="/admin/" />
    <title>Administration | Ressources L2 Informatique</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <!-- The site's own stylesheet gives the tokens, buttons, tabs and module code; admin.css adds the dashboard. -->
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-skip-link>Aller au contenu</a>
    <header class="admin-header">
      <div class="admin-header__inner page-width">
        <p class="admin-brand">
          <span class="admin-brand__name">Ressources L2 Informatique</span>
          <span class="admin-brand__zone">Administration</span>
        </p>
        <!-- admin.js adds the logged-in account and "Se déconnecter" here. -->
        <div class="admin-session" data-admin-session>
          <a href="../" target="_blank" rel="noopener">Voir le site<span class="visually-hidden"> (nouvel onglet)</span></a>
        </div>
      </div>
    </header>
    <main id="main" class="page-width" tabindex="-1">
      <noscript>
        <p class="noscript">L'administration a besoin de JavaScript.</p>
      </noscript>
      <!-- admin.js draws the login screen, then the dashboard, here. -->
      <div data-admin-root></div>
    </main>
    <footer class="admin-footer">
      <p class="page-width">
        Ancien formulaire, gardé provisoirement en secours : <a href="decap/">ouvrir l'éditeur Decap</a>.
      </p>
    </footer>
    <!-- No script comes from another site. These files hold the rules and the exchanges with GitHub and Netlify. -->
    <script src="catalogue-rules.js"></script>
    <script src="github-commit.js"></script>
    <script src="netlify-auth.js"></script>
    <script src="admin-flow.js"></script>
    <script type="module" src="admin.js"></script>
  </body>
</html>
